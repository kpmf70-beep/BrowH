<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brow Harmony AI</title>

    <!-- Meta tags para PWA (Progressive Web App) e mobile -->
    <meta name="theme-color" content="#C9A96E">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Brow Harmony">

    <!-- Favicons para diferentes contextos -->
    <link rel="icon" href="icons/favicon.ico" sizes="32x32">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    
    <!-- Seu CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- TensorFlow.js e MediaPipe Face Landmarks -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
</head>
<body>
    <div class="app-container">
        <!-- Tela de Captura de Foto -->
        <div id="capture-screen" class="screen active">
            <header class="app-header">
                <h1>Brow Harmony AI</h1>
            </header>
            <div class="capture-area">
                <input type="file" id="photo-input" accept="image/*"style="display: none;">
                <button id="capture-photo-btn" class="action-btn primary-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-camera"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    Tirar Foto
                </button>
                <p class="capture-tip">Para uma análise precisa, tire a foto de frente, com boa iluminação e sem óculos.</p>
            </div>
        </div>

        <!-- Tela de Análise e Design -->
        <div id="analysis-screen" class="screen">
            <header class="app-header">
                <button id="back-to-capture" class="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-arrow-left"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                </button>
                <h1>Análise e Design</h1>
            </header>

            <div class="analysis-photo-wrap">
                <img id="analysis-photo" class="analysis-photo" src="" alt="Foto para Análise">
                <canvas id="ai-overlay-canvas"></canvas>
                <canvas id="manual-canvas"></canvas>
                <div class="ai-analyzing-overlay" style="display:none;">
                    <div class="ai-ring"></div>
                    <div class="ai-status">Analisando rosto...</div>
                </div>
            </div>

            <div class="view-modes">
                <button class="mode-pill active" data-mode="analysis">Análise</button>
                <button class="mode-pill" data-mode="design">Design</button>
            </div>

            <!-- Resultados da Análise (Modo Análise) -->
            <div class="analysis-points" id="analysis-results">
                <div class="point-item">
                    <div class="point-dot"></div>
                    <div class="point-info">
                        <div class="point-label">Assimetria Vertical</div>
                        <div class="point-val" id="val-vertical">--</div>
                    </div>
                </div>
                <div class="point-item">
                    <div class="point-dot"></div>
                    <div class="point-info">
                        <div class="point-label">Assimetria Horizontal</div>
                        <div class="point-val" id="val-horizontal">--</div>
                    </div>
                </div>
                <div class="point-item">
                    <div class="point-dot"></div>
                    <div class="point-info">
                        <div class="point-label">Desvio do Arco</div>
                        <div class="point-val" id="val-arco">--</div>
                    </div>
                </div>
            </div>

            <!-- Barra de Ferramentas (Modo Design) -->
            <div class="tools-strip" id="design-tools" style="display:none;">
                <div class="tool-group">
                    <button class="tool-btn active" id="brush-tool" data-tool="brush">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-edit-2"><path d="M17 3a2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                    </button>
                    <button class="tool-btn" id="eraser-tool" data-tool="eraser">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x-circle"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                    </button>
                    <button class="tool-btn" id="undo-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-rotate-ccw"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.5 15a9 9 0 1 0 5.5-11.5"></path></svg>
                    </button>
                    <button class="tool-btn" id="clear-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-trash-2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </div>
                
                <div class="design-controls-group">
                    <h4>Ajustes de Visagismo</h4>
                    <div class="control-item">
                        <label for="arco-altura">Altura do Arco:</label>
                        <input type="range" id="arco-altura" min="-20" max="20" value="0">
                        <span id="arco-altura-val">0</span>
                    </div>
                    <div class="control-item">
                        <label for="cauda-comprimento">Comprimento da Cauda:</label>
                        <input type="range" id="cauda-comprimento" min="-20" max="20" value="0">
                        <span id="cauda-comprimento-val">0</span>
                    </div>
                    <div class="control-item">
                        <label for="espessura-sobrancelha">Espessura:</label>
                        <input type="range" id="espessura-sobrancelha" min="-5" max="5" value="0">
                        <span id="espessura-sobrancelha-val">0</span>
                    </div>
                </div>

                <button class="action-btn primary-btn" id="finalize-design-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Finalizar Design
                </button>
            </div>
        </div>
    </div>

    <!-- Seu JavaScript -->
    <script src="script.js"></script>
</body>
  </html>
